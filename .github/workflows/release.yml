name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish always
      - name: Publier la release (sortir du brouillon)
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          gh release edit "v$V" --draft=false --prerelease=false --latest --repo "${{ github.repository }}"
